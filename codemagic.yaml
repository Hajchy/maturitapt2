
workflows:
  ios-workflow:
    name: Maturitapt2 iOS
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Build iOS app
        script: |
          set -e
          xcodebuild \
            -project ios/Maturitapt2.xcodeproj \
            -scheme Maturitapt2 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Maturitapt2.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Maturitapt2.app
          cd build
          zip -qry Maturitapt2-unsigned.ipa Payload

    artifacts:
      - build/Maturitapt2-unsigned.ipa

